<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Démo complète des Boutons Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .spinner {
        border: 2px solid transparent;
        border-top-color: currentColor;
        border-radius: 9999px;
        width: 1rem;
        height: 1rem;
        animation: spin 0.5s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="space-y-12 bg-gray-50 p-8">
    <h1 class="text-3xl font-bold">Démo complète des Boutons Tailwind</h1>

    <!-- Variant : Normal (alias Soft par défaut) -->
    <section>
      <h2 class="mb-4 text-2xl font-semibold">Variant : Normal</h2>
      <div class="flex flex-wrap gap-4">
        <!-- Secondary -->
        <button class="rounded bg-gray-500 px-4 py-2 text-white transition hover:bg-gray-600">
          Secondary
        </button>
        <button
          disabled
          class="cursor-not-allowed rounded bg-gray-500 px-4 py-2 text-white opacity-50"
        >
          Secondary
        </button>
        <!-- Success -->
        <button class="rounded bg-green-500 px-4 py-2 text-white transition hover:bg-green-600">
          Success
        </button>
        <button
          disabled
          class="cursor-not-allowed rounded bg-green-500 px-4 py-2 text-white opacity-50"
        >
          Success
        </button>
        <!-- Info -->
        <button class="rounded bg-blue-500 px-4 py-2 text-white transition hover:bg-blue-600">
          Info
        </button>
        <button
          disabled
          class="cursor-not-allowed rounded bg-blue-500 px-4 py-2 text-white opacity-50"
        >
          Info
        </button>
        <!-- Warn -->
        <button class="rounded bg-yellow-500 px-4 py-2 text-white transition hover:bg-yellow-600">
          Warn
        </button>
        <button
          disabled
          class="cursor-not-allowed rounded bg-yellow-500 px-4 py-2 text-white opacity-50"
        >
          Warn
        </button>
        <!-- Help -->
        <button class="rounded bg-purple-500 px-4 py-2 text-white transition hover:bg-purple-600">
          Help
        </button>
        <button
          disabled
          class="cursor-not-allowed rounded bg-purple-500 px-4 py-2 text-white opacity-50"
        >
          Help
        </button>
        <!-- Danger -->
        <button class="rounded bg-red-500 px-4 py-2 text-white transition hover:bg-red-600">
          Danger
        </button>
        <button
          disabled
          class="cursor-not-allowed rounded bg-red-500 px-4 py-2 text-white opacity-50"
        >
          Danger
        </button>
        <!-- Contrast -->
        <button class="rounded bg-black px-4 py-2 text-white transition hover:bg-gray-800">
          Contrast
        </button>
        <button
          disabled
          class="cursor-not-allowed rounded bg-black px-4 py-2 text-white opacity-50"
        >
          Contrast
        </button>
      </div>
    </section>

        <button

        <button

        <button

        <button

        <button class="rounded bg-transparent px-4 py-2 text-red-500 transition hover:bg-red-100">

    <!-- Variant : Link -->

      <h2 class="mb-4 text-2xl font-semibold">Variant : Link</h2>
      <div class="flex flex-wrap gap-4">
        <button class="px-4 py-2 text-gray-500 underline transition hover:text-gray-700">
          Secondary
        </button>
        <button disabled class="cursor-not-allowed px-4 py-2 text-gray-500 underline opacity-50">

        </button>
        <button class="px-4 py-2 text-green-500 underline transition hover:text-green-700">

        <button class="px-4 py-2 text-yellow-500 underline transition hover:text-yellow-700">

</html>
