<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation de Football - Style & Fun (Corrigé V2)</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
            font-family: 'Arial', sans-serif;
            flex-direction: column;
            overflow: hidden;
        }
        .game-container {
            position: relative;
            border: 2px solid #333;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        canvas {
            display: block;
        }
        .ui-top {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 600px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #333;
        }
        .team-name {
            font-size: 1.1em;
            padding: 0 15px;
        }
        .team-red-text { color: red; }
        .team-blue-text { color: blue; }
        .score-board {
            font-size: 1.8em;
            display: flex;
            align-items: center;
        }
        .score-board span {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 5px;
            margin: 0 5px;
        }
        .score-red {
            background-color: red;
            color: white;
        }
        .score-blue {
            background-color: blue;
            color: white;
        }
        #timer {
            font-size: 1.2em;
            margin: 0 20px;
            min-width: 50px;
            text-align: center;
            background-color: #eee;
            padding: 3px 8px;
            border-radius: 4px;
            color: #555;
        }
        .controls {
            margin-top: 15px;
        }
        button {
            padding: 10px 18px;
            font-size: 1em;
            cursor: pointer;
            margin: 0 8px;
            border-radius: 20px;
            border: none;
            background-color: #4a4e69;
            color: white;
            transition: background-color 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
        button:hover {
            background-color: #6b7091;
        }
        #goalMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5em;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px black, 0 0 20px black;
            display: none;
            z-index: 10;
            animation: goalAnim 1.5s ease-out forwards;
            pointer-events: none;
        }
        @keyframes goalAnim {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }

    </style>
</head>
<body>

    <div class="ui-top">
        <span class="team-name team-red-text">Équipe Rouge</span>
        <div class="score-board">
            <span class="score-red" id="scoreRed">0</span>
            <span>-</span>
            <span class="score-blue" id="scoreBlue">0</span>
        </div>
         <span id="timer">00:00</span>
        <span class="team-name team-blue-text">Équipe Bleue</span>
    </div>

    <div class="game-container">
        <canvas id="footballField" width="600" height="400"></canvas>
        <div id="goalMessage">GOOOAAAL!</div>
    </div>

    <div class="controls">
        <button id="startButton">Démarrer</button>
        <button id="resetButton">Réinitialiser Jeu</button>
    </div>

    <script>
        const canvas = document.getElementById('footballField');
        const ctx = canvas.getContext('2d');
        const fieldWidth = canvas.width;
        const fieldHeight = canvas.height;

        // --- Constants ---
        const playerRadius = 9;
        const ballRadius = 6;
        const goalHeight = 60;
        const goalPostY1 = (fieldHeight - goalHeight) / 2;
        const goalPostY2 = (fieldHeight + goalHeight) / 2;
        const goalDepth = 15;

        const MAX_PLAYER_SPEED = 2.2;
        const MAX_BALL_SPEED = 5.0;
        const BALL_BOUNCE_FACTOR = -0.85;
        const KICK_FORCE = 2.1;
        const ATTRACTION_TO_BALL = 0.045;
        const SHOOT_FORCE = 0.065;
        const PLAYER_SEPARATION = 0.035;
        const TRACE_ALPHA = 0.15;

        // --- Game State ---
        let teamRed = [];
        let teamBlue = [];
        let ball = {};
        let particles = [];
        let scoreRed = 0;
        let scoreBlue = 0;
        let gameTime = 0;
        let timerInterval = null;
        let animationFrameId;
        let isRunning = false;

        // --- UI Elements ---
        const scoreRedEl = document.getElementById('scoreRed');
        const scoreBlueEl = document.getElementById('scoreBlue');
        const timerEl = document.getElementById('timer');
        const goalMessageEl = document.getElementById('goalMessage');
        const startButton = document.getElementById('startButton');
        const resetButton = document.getElementById('resetButton');

        // --- Score & Timer ---
        function updateScoreDisplay() { scoreRedEl.textContent = scoreRed; scoreBlueEl.textContent = scoreBlue; }
        function formatTime(seconds) { const mins = Math.floor(seconds / 60); const secs = seconds % 60; return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`; }
        function updateTimerDisplay() { timerEl.textContent = formatTime(gameTime); }
        function startTimer() { stopTimer(); timerInterval = setInterval(() => { gameTime++; updateTimerDisplay(); }, 1000); }
        function stopTimer() { clearInterval(timerInterval); timerInterval = null; }

        // --- Drawing Functions ---

        // *** FUNCTION AJOUTÉE / ADDED FUNCTION ***
        function drawCircle(x, y, radius, color) {
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2, false);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.closePath();
        }
        // ****************************************

        function drawPlayer(player) {
            const { x, y, color } = player;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.3)'; ctx.shadowBlur = 6; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
            ctx.beginPath(); ctx.arc(x, y, playerRadius, 0, Math.PI * 2, false); ctx.fillStyle = color; ctx.fill(); ctx.closePath();
            ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
            ctx.fillStyle = 'white'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(color === 'red' ? 'R' : 'B', x, y + 1);
        }

        function drawField() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)'; ctx.lineWidth = 2;
            ctx.strokeRect(1, 1, fieldWidth - 2, fieldHeight - 2);
            ctx.beginPath(); ctx.moveTo(fieldWidth / 2, 0); ctx.lineTo(fieldWidth / 2, fieldHeight); ctx.stroke();
            ctx.beginPath(); ctx.arc(fieldWidth / 2, fieldHeight / 2, 50, 0, Math.PI * 2, false); ctx.stroke();
            const paWidth = 100, paHeight = 200;
            ctx.strokeRect(0, (fieldHeight - paHeight) / 2, paWidth, paHeight); ctx.strokeRect(fieldWidth - paWidth, (fieldHeight - paHeight) / 2, paWidth, paHeight);
            ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.beginPath(); ctx.moveTo(1, goalPostY1); ctx.bezierCurveTo(1 - goalDepth * 1.5, goalPostY1 + goalHeight * 0.2, 1 - goalDepth * 1.5, goalPostY2 - goalHeight * 0.2, 1, goalPostY2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(fieldWidth - 1, goalPostY1); ctx.bezierCurveTo(fieldWidth - 1 + goalDepth * 1.5, goalPostY1 + goalHeight * 0.2, fieldWidth - 1 + goalDepth * 1.5, goalPostY2 - goalHeight * 0.2, fieldWidth - 1, goalPostY2); ctx.stroke();
            ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.beginPath(); ctx.moveTo(1, goalPostY1); ctx.lineTo(1, goalPostY2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(fieldWidth - 1, goalPostY1); ctx.lineTo(fieldWidth - 1, goalPostY2); ctx.stroke();
            ctx.lineWidth = 2;
        }

        // --- Particle System ---
        function createParticle(x, y, color) { const angle = Math.random() * Math.PI * 2; const speed = Math.random() * 3 + 1; const life = Math.random() * 60 + 30; return { x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, radius: Math.random() * 2 + 1, color: color || `rgba(255, 255, ${Math.random() > 0.5 ? 255 : 150}, ${Math.random() * 0.5 + 0.5})`, life: life, maxLife: life, }; }
        function createGoalParticles(goalX, goalY, teamColor) { particles = []; const numParticles = 50; for (let i = 0; i < numParticles; i++) { particles.push(createParticle(goalX, goalY, teamColor)); } }
        function updateParticles() { for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= 1; p.vx *= 0.99; p.vy *= 0.99; if (p.life <= 0) { particles.splice(i, 1); } } }
        function drawParticles() { particles.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, p.radius * (p.life / p.maxLife), 0, Math.PI * 2, false); ctx.fillStyle = p.color.startsWith('rgba') ? p.color.replace(/,[^,]+?\)$/, `, ${p.life / p.maxLife})`) : p.color; ctx.fill(); ctx.closePath(); }); }

        // --- Goal Message ---
        function showGoalMessage() { goalMessageEl.style.display = 'none'; void goalMessageEl.offsetWidth; goalMessageEl.style.display = 'block'; }

        // --- Initialization ---
        function definePlayer(x, y, color) { return { x, y, color, vx: 0, vy: 0 }; }

        function resetPositions(keepBallVelocity = false) {
            teamRed = [ definePlayer(60, fieldHeight / 2, 'red'), definePlayer(140, fieldHeight / 3.5, 'red'), definePlayer(140, fieldHeight * 2.5 / 3.5, 'red'), definePlayer(230, fieldHeight / 4, 'red'), definePlayer(230, fieldHeight * 3 / 4, 'red'), definePlayer(290, fieldHeight / 2, 'red') ];
            teamBlue = [ definePlayer(fieldWidth - 60, fieldHeight / 2, 'blue'), definePlayer(fieldWidth - 140, fieldHeight / 3.5, 'blue'), definePlayer(fieldWidth - 140, fieldHeight * 2.5 / 3.5, 'blue'), definePlayer(fieldWidth - 230, fieldHeight / 4, 'blue'), definePlayer(fieldWidth - 230, fieldHeight * 3 / 4, 'blue'), definePlayer(fieldWidth - 290, fieldHeight / 2, 'blue') ];
            ball = { x: fieldWidth / 2, y: fieldHeight / 2, color: '#ffffff', vx: 0, vy: 0 };
            if (!keepBallVelocity) { ball.vx = (Math.random() - 0.5) * 2; ball.vy = (Math.random() - 0.5) * 2; }
            if (!isRunning) { drawEverything(); }
        }

        function resetGame() {
            stopTimer(); if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }
            isRunning = false; startButton.textContent = 'Démarrer';
            scoreRed = 0; scoreBlue = 0; updateScoreDisplay();
            gameTime = 0; updateTimerDisplay();
            particles = []; resetPositions(false);
            ctx.fillStyle = '#4CAF50'; ctx.fillRect(0, 0, fieldWidth, fieldHeight);
            drawEverything();
        }

        // --- Update Logic ---
        function updatePositions() {
            // Update players
            [...teamRed, ...teamBlue].forEach((player, p_idx, allPlayers) => {
                let targetVx = 0, targetVy = 0;
                const dxBall = ball.x - player.x, dyBall = ball.y - player.y; const distBall = Math.sqrt(dxBall * dxBall + dyBall * dyBall) || 1;
                targetVx += (dxBall / distBall) * ATTRACTION_TO_BALL; targetVy += (dyBall / distBall) * ATTRACTION_TO_BALL;
                const targetGoalX = (player.color === 'red') ? fieldWidth : 0, targetGoalY = fieldHeight / 2;
                if (distBall < playerRadius * 7) { const dxGoal = targetGoalX - player.x, dyGoal = targetGoalY - player.y; const distGoal = Math.sqrt(dxGoal * dxGoal + dyGoal * dyGoal) || 1; targetVx += (dxGoal / distGoal) * SHOOT_FORCE; targetVy += (dyGoal / distGoal) * SHOOT_FORCE; }
                 allPlayers.forEach((otherPlayer, o_idx) => { if (p_idx === o_idx) return; const dx = otherPlayer.x - player.x, dy = otherPlayer.y - player.y; const dist = Math.sqrt(dx * dx + dy * dy) || 1; if (dist < playerRadius * 5) { targetVx -= (dx / dist) * PLAYER_SEPARATION; targetVy -= (dy / dist) * PLAYER_SEPARATION; } });
                player.vx += targetVx; player.vy += targetVy;
                const speed = Math.sqrt(player.vx * player.vx + player.vy * player.vy); if (speed > MAX_PLAYER_SPEED) { player.vx = (player.vx / speed) * MAX_PLAYER_SPEED; player.vy = (player.vy / speed) * MAX_PLAYER_SPEED; }
                player.x += player.vx; player.y += player.vy;
                if (player.x < playerRadius) { player.x = playerRadius; player.vx *= -0.5; } if (player.x > fieldWidth - playerRadius) { player.x = fieldWidth - playerRadius; player.vx *= -0.5; } if (player.y < playerRadius) { player.y = playerRadius; player.vy *= -0.5; } if (player.y > fieldHeight - playerRadius) { player.y = fieldHeight - playerRadius; player.vy *= -0.5; }
                player.vx *= 0.96; player.vy *= 0.96;
            });

            // Ball Update
            ball.x += ball.vx; ball.y += ball.vy;
            let goalScored = false; let goalTeamColor = null; let goalX = 0;
            if (ball.x < ballRadius) { if (ball.y > goalPostY1 && ball.y < goalPostY2) { scoreBlue++; goalScored = true; goalTeamColor = 'blue'; goalX = 0;} else { ball.vx *= BALL_BOUNCE_FACTOR; ball.x = ballRadius; } }
            else if (ball.x > fieldWidth - ballRadius) { if (ball.y > goalPostY1 && ball.y < goalPostY2) { scoreRed++; goalScored = true; goalTeamColor = 'red'; goalX = fieldWidth;} else { ball.vx *= BALL_BOUNCE_FACTOR; ball.x = fieldWidth - ballRadius; } }
            if (ball.y < ballRadius || ball.y > fieldHeight - ballRadius) { ball.vy *= BALL_BOUNCE_FACTOR; ball.y = Math.max(ballRadius, Math.min(fieldHeight - ballRadius, ball.y)); }
            ball.vx *= 0.995; ball.vy *= 0.995;

             // Player-Ball Collision
             [...teamRed, ...teamBlue].forEach(player => {
                const dx = ball.x - player.x, dy = ball.y - player.y; const distance = Math.sqrt(dx * dx + dy * dy); const minDist = playerRadius + ballRadius;
                if (distance < minDist) {
                    const angle = Math.atan2(dy, dx);
                    const targetGoalX = (player.color === 'red') ? fieldWidth : 0; const targetGoalY = fieldHeight / 2;
                    const angleToGoal = Math.atan2(targetGoalY - player.y, targetGoalX - player.x); const kickAngle = angle * 0.6 + angleToGoal * 0.4;
                    ball.vx += Math.cos(kickAngle) * KICK_FORCE; ball.vy += Math.sin(kickAngle) * KICK_FORCE;
                    const overlap = minDist - distance; ball.x += Math.cos(angle) * overlap; ball.y += Math.sin(angle) * overlap;
                }
             });
             const ballSpeed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy); if (ballSpeed > MAX_BALL_SPEED) { ball.vx = (ball.vx / ballSpeed) * MAX_BALL_SPEED; ball.vy = (ball.vy / ballSpeed) * MAX_BALL_SPEED; }

             // Handle Goal Effects
             if (goalScored) { updateScoreDisplay(); createGoalParticles(goalX, fieldHeight / 2, goalTeamColor); showGoalMessage(); resetPositions(false); }

             // Update Particles
             updateParticles();
        }

        // --- Drawing ---
        function drawEverything() {
            // Trace Effect
            ctx.fillStyle = `rgba(76, 175, 80, ${TRACE_ALPHA})`;
            ctx.fillRect(0, 0, fieldWidth, fieldHeight);

            // Draw static elements
            drawField();
            // *** Use drawCircle for center spot ***
            drawCircle(fieldWidth / 2, fieldHeight / 2, 3, 'rgba(255, 255, 255, 0.8)');

            // Draw dynamic elements
            teamRed.forEach(player => drawPlayer(player));
            teamBlue.forEach(player => drawPlayer(player));
            // *** Use drawCircle for the ball ***
            drawCircle(ball.x, ball.y, ballRadius, ball.color);

            // Draw Particles
            drawParticles();
        }

        // --- Game Loop ---
        function gameLoop() { if (!isRunning) return; updatePositions(); drawEverything(); animationFrameId = requestAnimationFrame(gameLoop); }

         // --- Event Listeners ---
         startButton.addEventListener('click', () => { isRunning = !isRunning; if (isRunning) { startButton.textContent = 'Pause'; startTimer(); if (!animationFrameId) { gameLoop(); } } else { startButton.textContent = 'Démarrer'; stopTimer(); if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; } } });
         resetButton.addEventListener('click', () => { resetGame(); });

        // --- Initial Setup ---
        window.onload = () => {
            resetGame();
        };

    </script>

</body>
</html>
